      - name: Placeholder — replace with your backend checks
        run: echo "Configure backend job for your stack"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 'frontend'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Advisory checks — replace with your actual commands
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      - name: Typecheck (advisory)
        continue-on-error: true
        run: npm run typecheck

      # Blocking checks — enable after verified green locally
      # - name: Unit tests
      #   run: npm test

      # - name: Build
      #   run: npm run build

      - name: Placeholder — replace with your frontend checks
        run: echo "Configure frontend job for your stack"

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'gateway'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'gateway/package-lock.json'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Advisory checks — replace with your actual commands
      - name: Typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        continue-on-error: true
        run: npm run lint

      # Blocking checks — enable after verified green locally
      # - name: Tests
      #   run: npm test

      - name: Placeholder — replace with your gateway checks
        run: echo "Configure gateway job for your stack"