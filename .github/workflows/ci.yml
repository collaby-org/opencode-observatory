# Consolidated CI — production track
#
# Replaces separate backend, frontend, gateway workflows.
# Cost discipline: one workflow, multiple jobs, paths filters, concurrency.
# Every step not verified-reliable is continue-on-error; blocking reserved for
# checks that have actually been run green.

name: CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'gateway/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'backend'
    timeout-minutes: 25
